# p2000-chirp configuration
# Copy to config.toml and edit. Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
# live in .env, not here. config.toml is gitignored on purpose: keep your
# personal areas/coordinates out of the repo.

# Poll pacing: sources are polled on staggered slot schedules, this many
# seconds apart. A single source is polled at least every 15s; with N
# sources each is polled every (this x N) seconds — e.g. 3 sources at 5s =
# each source every 15s. Every poll gets a random 1-3s jitter. Failing
# sources back off exponentially (capped at 10 minutes); 429s are honored
# via Retry-After (capped likewise).
poll_interval_seconds = 5
stale_after_minutes = 15
# Dedupe state lives here; mount this path as a volume in Docker so
# seen-items survive restarts.
state_file = "state/state.json"
prune_hours = 24
# A delivered/bootstrap identity stays suppressed until this many seconds
# pass without seeing it again. Duplicate observations refresh the window:
# feeds retaining old items for hours must not re-notify every hour.
# New dispatches with different text and bon/rit/sequence numbers still pass.
dedupe_window_seconds = 3600

[[sources]]
type = "rss"
url = "https://p2000.brandweer-berkel-enschot.nl/homeassistant/rss.asp"

[[sources]]
type = "p2000alarm"
url = "https://monitor.p2000alarm.nl/ReadMonitor.php"

[[sources]]
type = "alarmeringen"
url = "https://alarmeringen.nl/feeds/all.rss"

[filters]
# Independent OR triggers: an item passes if ANY configured axis matches.
# Leave a list empty to disable that axis. All empty = everything passes.
regions = []
# Postcode digit prefixes matched against "3511AB", "3511 AB", or bare "3511"
# in message text. "3511" covers every letter suffix; "351" covers 3510-3519.
# Bare four-digit numbers can also match unrelated numbers in dispatch text.
postcodes = []
# Substrings matched against message text, e.g. street or place names.
keywords = []
# Hard filter (AND with area). Items with unknown discipline are dropped.
# Short forms work: "Brandweer" matches "Brandweerdiensten".
disciplines = ["Brandweer", "Ambulance", "Politie"]

# Optional radius axis: notify when an item carries coordinates within
# `km` of lat/lon (only the RSS source provides coordinates; items without
# them rely on the axes above). Find your lat/lon by right-clicking in
# Google Maps / OpenStreetMap.
[filters.radius]
# lat = 52.0907
# lon = 5.1214
# km = 1.5
